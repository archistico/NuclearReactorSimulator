name: ordinary-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Ordinary build, tests and current evidence
        shell: cmd
        run: eng\ci-ordinary.cmd
