<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
<title id="title">Bilancio totale nullo, inventari ancora in deriva</title><desc id="desc">Due volumi ideali A e B ricevono e cedono in totale 5 MW, ma il trasferimento interno è 4,9 MW. A accumula 0,1 MW e B perde 0,1 MW. Dopo 60 secondi le variazioni di energia sono più 6 e meno 6 MJ: la somma nulla non rende stazionari i singoli volumi.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a78d6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d45a28"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6250d6"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#58635f"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif">
<rect width="1000" height="740" fill="#faf9f5"/>
<text x="36" y="44" font-size="25" fill="#202523" text-anchor="start" font-weight="650"><tspan x="36" dy="0">Bilancio totale nullo, inventari ancora in deriva</tspan></text>
<text x="36" y="78" font-size="16" fill="#58635f" text-anchor="start" font-weight="400"><tspan x="36" dy="0">Esempio aritmetico di scambi energetici; valori diversi da quelli del profilo desktop.</tspan></text>
<rect x="130" y="122" width="780" height="298" rx="12" fill="none" stroke="#58635f" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="150" y="151" font-size="17" fill="#58635f" text-anchor="start" font-weight="400"><tspan x="150" dy="0">Confine complessivo: A + B</tspan></text>
<rect x="170" y="184" width="300" height="205" rx="12" fill="#ffffff" stroke="#d6dcd8" stroke-width="1.5"/>
<text x="320" y="221" font-size="23" fill="#202523" text-anchor="middle" font-weight="650"><tspan x="320" dy="0">Volume A</tspan></text>
<text x="320" y="263" font-size="18" fill="#58635f" text-anchor="middle" font-weight="400"><tspan x="320" dy="0">riceve 5,0 MW</tspan><tspan x="320" dy="26.099999999999998">cede 4,9 MW</tspan></text>
<text x="320" y="350" font-size="22" fill="#6250d6" text-anchor="middle" font-weight="650"><tspan x="320" dy="0">accumula +0,1 MW</tspan></text>
<rect x="570" y="184" width="300" height="205" rx="12" fill="#ffffff" stroke="#d6dcd8" stroke-width="1.5"/>
<text x="720" y="221" font-size="23" fill="#202523" text-anchor="middle" font-weight="650"><tspan x="720" dy="0">Volume B</tspan></text>
<text x="720" y="263" font-size="18" fill="#58635f" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">riceve 4,9 MW</tspan><tspan x="720" dy="26.099999999999998">cede 5,0 MW</tspan></text>
<text x="720" y="350" font-size="22" fill="#d45a28" text-anchor="middle" font-weight="650"><tspan x="720" dy="0">perde −0,1 MW</tspan></text>
<path d="M24,296 L170,296" fill="none" stroke="#d45a28" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<text x="83" y="268" font-size="18" fill="#d45a28" text-anchor="middle" font-weight="600"><tspan x="83" dy="0">5,0 MW</tspan></text>
<path d="M470,296 L570,296" fill="none" stroke="#d45a28" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<text x="520" y="268" font-size="18" fill="#d45a28" text-anchor="middle" font-weight="600"><tspan x="520" dy="0">4,9 MW</tspan></text>
<path d="M870,296 L976,296" fill="none" stroke="#d45a28" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<text x="923" y="268" font-size="18" fill="#d45a28" text-anchor="middle" font-weight="600"><tspan x="923" dy="0">5,0 MW</tspan></text>
<rect x="40" y="454" width="920" height="88" rx="12" fill="#edf3f0" stroke="#d6dcd8" stroke-width="1.5"/>
<text x="500" y="488" font-size="23" fill="#202523" text-anchor="middle" font-weight="600"><tspan x="500" dy="0">Accumulo totale: +0,1 MW − 0,1 MW = 0 MW</tspan></text>
<text x="500" y="521" font-size="18" fill="#58635f" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Il conto globale chiude; ciascun volume continua a cambiare.</tspan></text>
<rect x="40" y="566" width="920" height="107" rx="12" fill="#ffffff" stroke="#d6dcd8" stroke-width="1.5"/>
<text x="62" y="598" font-size="19" fill="#202523" text-anchor="start" font-weight="600"><tspan x="62" dy="0">Dopo 60 secondi: variazione dell’energia contenuta</tspan></text>
<text x="200" y="643" font-size="23" fill="#6250d6" text-anchor="middle" font-weight="650"><tspan x="200" dy="0">A: +6 MJ</tspan></text>
<text x="500" y="643" font-size="23" fill="#d45a28" text-anchor="middle" font-weight="650"><tspan x="500" dy="0">B: −6 MJ</tspan></text>
<text x="800" y="643" font-size="23" fill="#202523" text-anchor="middle" font-weight="650"><tspan x="800" dy="0">Somma: 0 MJ</tspan></text>
<text x="40" y="711" font-size="18" fill="#58635f" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Per verificare un equilibrio servono anche i bilanci dei singoli nodi, non soltanto la somma.</tspan></text>
</g>
</svg>
