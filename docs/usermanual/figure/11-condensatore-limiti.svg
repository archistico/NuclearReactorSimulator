<text x="110.0" y="440.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Se arriva più energia di quanta il condensatore ne smaltisca, la pressione sale: sale anche la temperatura</text>
<text x="110.0" y="458.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">di saturazione e con essa ΔT verso l'acqua di raffreddamento. Oltre il tetto di 40 MW questo recupero</text>
<text x="110.0" y="476.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">si esaurisce e la pressione si avvicina alle soglie. La portata massima di 20 kg/s è un limite in più.</text>
<text x="24.0" y="504.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Temperatura di saturazione da IAPWS-IF97; ΔT riferito all'acqua a 20 °C. Diagramma di principio del limite termico.</text>
</svg>
