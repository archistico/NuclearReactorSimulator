<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Condensatore: perché la pressione di scarico si muove</title>
<desc id="desc">Grafico della potenza rimovibile in funzione della pressione del condensatore, con acqua a 20 gradi e UA 1,225 MW/K. La curva UA per ΔT cresce con la pressione ed è troncata a 40 MW, raggiunti a circa 14 kPa. Il punto iniziale a 8,4 kPa rimuove circa 27 MW. Linee verticali segnano avvertimento a 20 kPa e scatto a 30 kPa.</desc>
