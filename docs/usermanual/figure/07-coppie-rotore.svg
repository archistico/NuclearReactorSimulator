<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Il rotore somma le coppie: la differenza diventa accelerazione</title>
<desc id="desc">Schema dell'albero con turbina, rotore e generatore. La coppia motrice della turbina è contrastata dalla coppia resistente del generatore e dalle perdite; la coppia netta divisa per l'inerzia dà l'accelerazione. Un esempio numerico converte 1 MW di squilibrio in circa 30 giri/min al secondo.</desc>
<rect x="0.5" y="0.5" width="899.0" height="529.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Il rotore somma le coppie: la differenza diventa accelerazione</text>
<defs><marker id="aeb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a2a78d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="a6250d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker></defs>
<path d="M110,150 L210,110 L210,250 L110,210 Z" fill="#fbe0d3" stroke="#eb6834" stroke-width="2"/>
<text x="160.0" y="280.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Turbina</text>
<rect x="210.0" y="172.0" width="440.0" height="16.0" rx="4" fill="#c3c2b7" stroke="#52514e" stroke-width="1.5"/>
<ellipse cx="430" cy="180" rx="22" ry="80" fill="#e1e0d9" stroke="#52514e" stroke-width="2"/>
<text x="430.0" y="284.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">rotore · J = 1000 kg·m²</text>
<circle cx="690.0" cy="180.0" r="46" fill="#fcfcfb" stroke="#6250d6" stroke-width="2.5"/>
<text x="690.0" y="186.0" font-size="18" fill="#6250d6" text-anchor="middle" font-weight="700">G</text>
<text x="690.0" y="252.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Generatore</text>
<path d="M260.0,120.0 L360.0,120.0" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aeb6834)"/>
<text x="240.0" y="102.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">coppia della turbina: motrice</text>
<path d="M640.0,120.0 L500.0,120.0" fill="none" stroke="#6250d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6250d6)"/>
<text x="560.0" y="102.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">coppia del generatore: resistente</text>
<path d="M570.0,230.0 L480.0,230.0" fill="none" stroke="#52514e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<text x="525.0" y="254.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">perdite meccaniche</text>
<rect x="80.0" y="318.0" width="740.0" height="70.0" rx="6" fill="#f0efec" stroke="none" stroke-width="1.5"/>
<text x="330.0" y="346.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">J · dω/dt = coppia turbina − coppia generatore − perdite</text>
<text x="700.0" y="346.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">potenza = coppia · ω</text>
<text x="450.0" y="372.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">coppia netta &gt; 0: il gruppo accelera · = 0: velocità costante · &lt; 0: rallenta</text>
<text x="80.0" y="420.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Esempio: a 3000 giri/min ω ≈ 314 rad/s. Uno squilibrio di 1 MW vale circa 3.183 N·m:</text>
<text x="80.0" y="438.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">il rotore cambia velocità di circa 3,2 rad/s², cioè circa 30 giri/min al secondo.</text>
<text x="80.0" y="456.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Senza la coppia del generatore, con circa 5 MW di vapore utile e la stessa coppia di turbina, i 3300 giri/min</text>
<text x="80.0" y="474.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">della protezione di sovravelocità sarebbero raggiunti in circa 2 s: per questo si coordina l'ammissione.</text>
<text x="24.0" y="514.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Ordini di grandezza con J = 1000 kg·m²; regolatore e protezioni modificano la risposta reale del simulatore.</text>
</svg>
