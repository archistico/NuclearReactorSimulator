<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Tre itinerari nel manuale</title>
<desc id="desc">Tre righe di capitoli collegati da frecce. Primo contatto: capitoli 1, 2, 9 e 17. Capire perché: capitoli 3, 4, 5, 6 e 7. Condurre e diagnosticare: capitoli 8, 10, 11, 12, 13 e 14. Glossario e limiti del modello sono riferimenti comuni.</desc>
