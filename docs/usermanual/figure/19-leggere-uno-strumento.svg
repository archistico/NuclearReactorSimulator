<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Leggere uno strumento: misura, riferimento, banda e soglia</title>
<desc id="desc">A sinistra un quadrante di velocità con fondo scala, banda ciano della finestra obiettivo, segno ciano del riferimento a 3000 giri/min, segno rosso della soglia di protezione a 3300 e lancetta della misura a 3010 con tendenza stabile. A destra due andamenti della contropressione che arrivano entrambi a 18 kPa, uno in discesa e uno in salita rapida.</desc>
