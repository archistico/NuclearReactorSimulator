<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Il corpo cilindrico: dove acqua e vapore si separano</title>
<desc id="desc">Sezione schematica del corpo cilindrico pieno d'acqua a metà: entrano la miscela dai canali e l'acqua di alimentazione, escono il vapore verso la linea principale e il liquido verso il ricircolo. Una scala laterale indica livello normale 50%, avvertimento 25%, scatto al 10% e reset dal 20%.</desc>
<rect x="0.5" y="0.5" width="899.0" height="489.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Il corpo cilindrico: dove acqua e vapore si separano</text>
<defs><marker id="a2a78d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="aeb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<rect x="200.0" y="120.0" width="420.0" height="200.0" rx="90" fill="#fbe0d3" stroke="#52514e" stroke-width="2"/>
<clipPath id="drumclip"><rect x="200" y="120" width="420" height="200" rx="90"/></clipPath>
<rect x="200" y="220.0" width="420" height="100.0" fill="#cde2fb" clip-path="url(#drumclip)"/>
<line x1="230.0" y1="220.0" x2="590.0" y2="220.0" stroke="#2a78d6" stroke-width="2"/>
<text x="410.0" y="170.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">spazio vapore</text>
<text x="410.0" y="280.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">acqua (liquido)</text>
<path d="M410.0,116.0 L410.0,60.0" fill="none" stroke="#eb6834" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aeb6834)"/>
<text x="426.0" y="72.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">vapore verso la linea principale</text>
<path d="M80.0,236.0 L196.0,236.0" fill="none" stroke="#eb6834" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aeb6834)"/>
<text x="40.0" y="210.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">miscela dai canali</text>
<text x="40.0" y="228.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">(ritorno caldo)</text>
<path d="M80.0,290.0 L208.0,290.0" fill="none" stroke="#2a78d6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a78d6)"/>
<text x="40.0" y="312.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">acqua di alimentazione</text>
<path d="M494.0,322.0 L494.0,372.0" fill="none" stroke="#2a78d6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a78d6)"/>
<text x="510.0" y="364.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">liquido verso il ricircolo (pompe MCP)</text>
<rect x="730.0" y="110.0" width="26.0" height="220.0" rx="5" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="743.0" y="100.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">livello %</text>
<line x1="724.0" y1="220.0" x2="762.0" y2="220.0" stroke="#0ca30c" stroke-width="3"/>
<text x="768.0" y="224.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">normale ≈ 50%</text>
<line x1="724.0" y1="275.0" x2="762.0" y2="275.0" stroke="#fab219" stroke-width="3"/>
<g transform="translate(768.0,264.0)"><path d="M6,0 L12,11 L0,11 Z" fill="#fab219"/><text x="6" y="10" font-size="8" fill="#0b0b0b" text-anchor="middle" font-weight="700">!</text></g>
<text x="786.0" y="279.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">avvertimento 25%</text>
<line x1="724.0" y1="308.0" x2="762.0" y2="308.0" stroke="#d03b3b" stroke-width="3"/>
<g transform="translate(768.0,297.0)"><path d="M6,0 L12,11 L0,11 Z" fill="#d03b3b"/><text x="6" y="10" font-size="8" fill="#0b0b0b" text-anchor="middle" font-weight="700">!</text></g>
<text x="786.0" y="312.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">scatto ≤ 10%</text>
<line x1="724.0" y1="286.0" x2="756.0" y2="286.0" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="720.0" y="290.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal" font-style="italic">reset ≥ 20%</text>
<text x="40.0" y="420.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Il livello non è la quantità di acqua di tutto il circuito: è un indicatore del liquido in questo volume. Se il</text>
<text x="40.0" y="438.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">vapore cambia di quantità, il livello può muoversi anche con poca massa in più o in meno. Allo scatto (≤ 10%)</text>
<text x="40.0" y="456.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">intervengono insieme reattore, turbina e generatore; per il reset il livello deve risalire almeno al 20%.</text>
<text x="24.0" y="474.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Separazione idealizzata del modello; proporzioni non costruttive.</text>
</svg>
