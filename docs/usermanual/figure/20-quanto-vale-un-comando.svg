<text x="596.0" y="166.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">7</text>
<text x="664.0" y="166.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">8</text>
<text x="732.0" y="166.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">9</text>
<text x="800.0" y="166.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">10</text>
<text x="810.0" y="166.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">MWe</text>
<text x="290.0" y="139.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">richiesta iniziale 5 MWe</text>
<text x="630.0" y="139.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">+5 MWe con un solo comando</text>
<text x="800.0" y="112.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">targa 10 MWe</text>
<text x="40.0" y="194.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Una pressione vale metà della targa del generatore: è una variazione grande, non una regolazione fine.</text>
<text x="40.0" y="262.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">SPEED RAISE: +10 giri/min di riferimento per richiesta accettata</text>
