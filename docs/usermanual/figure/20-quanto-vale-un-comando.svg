<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Quanto cambia una pressione del pulsante</title>
<desc id="desc">In alto la richiesta di carico: da 5 MWe un solo LOAD RAISE porta a 10 MWe, la targa del generatore. In basso il riferimento di velocità: ogni SPEED RAISE aggiunge 10 giri/min; fra 3000 e la soglia di scatto a 3300 ci sono 30 passi.</desc>
<rect x="0.5" y="0.5" width="899.0" height="469.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Quanto cambia una pressione del pulsante</text>
<defs><marker id="aeb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a6250d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="70.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">LOAD RAISE: +5 MWe per richiesta accettata</text>
<rect x="120.0" y="120.0" width="680.0" height="28.0" rx="4" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
