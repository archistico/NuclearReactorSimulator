<text x="239.5" y="378.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">ogni freccia = una richiesta accettata</text>
<text x="40.0" y="410.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Dal nominale alla soglia di sovravelocità ci sono 30 passi di riferimento: la scala è fine, ma il riferimento</text>
<text x="40.0" y="428.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">non è la velocità. Dopo ogni richiesta guarda come la velocità misurata segue, prima di premere di nuovo.</text>
