<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">L'impianto in un colpo d'occhio</title>
<desc id="desc">Schema funzionale del ciclo a produzione diretta di vapore: ricircolo fra corpo cilindrico, pompe e nocciolo; vapore verso collettore, valvole STOP, CONTROL e ADMISSION, turbina, albero, generatore e rete; scarico al condensatore raffreddato da acqua esterna; ritorno tramite vasca del condensato, pompa del condensato, volume e pompa di alimentazione; bypass e sfioro automatici dal collettore.</desc>
