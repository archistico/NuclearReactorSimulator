<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Riconoscere, attendere il rientro, poi resettare</title>
<desc id="desc">Cronologia su tre righe. La condizione è presente dal passo 1 al passo 4. L'allarme non memorizzato diventa riconosciuto con ACKNOWLEDGE e sparisce quando la condizione rientra. Lo scatto memorizzato resta attivo: il PROTECTION RESET è rifiutato mentre la causa è presente e accettato dopo il rientro.</desc>
<rect x="0.5" y="0.5" width="899.0" height="489.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Riconoscere, attendere il rientro, poi resettare</text>
<defs><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="40.0" y="95.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Condizione del processo</text>
<line x1="230.0" y1="108.0" x2="840.0" y2="108.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="40.0" y="165.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Allarme non memorizzato</text>
<line x1="230.0" y1="178.0" x2="840.0" y2="178.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="40.0" y="235.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Scatto memorizzato</text>
<line x1="230.0" y1="248.0" x2="840.0" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#ffffff" opacity="0.45"/></pattern></defs>
<rect x="291.0" y="80.0" width="305.0" height="24.0" rx="4" fill="#c3c2b7" stroke="none" stroke-width="1.5"/>
<text x="443.5" y="96.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">presente</text>
<rect x="291.0" y="150.0" width="91.5" height="24.0" rx="4" fill="#fab219" stroke="none" stroke-width="1.5"/>
<rect x="291.0" y="150" width="91.5" height="24" rx="4" fill="url(#hatch)"/>
<text x="336.8" y="166.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">nuovo</text>
<rect x="382.5" y="150.0" width="213.5" height="24.0" rx="4" fill="#fde7b0" stroke="none" stroke-width="1.5"/>
<text x="489.2" y="166.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">riconosciuto</text>
<rect x="291.0" y="220.0" width="91.5" height="24.0" rx="4" fill="#d03b3b" stroke="none" stroke-width="1.5"/>
<rect x="291.0" y="220" width="91.5" height="24" rx="4" fill="url(#hatch)"/>
<text x="336.8" y="236.0" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="600">nuovo</text>
<rect x="382.5" y="220.0" width="323.3" height="24.0" rx="4" fill="#f2b7b7" stroke="none" stroke-width="1.5"/>
<text x="544.1" y="236.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">riconosciuto, memoria attiva</text>
<text x="604.0" y="166.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">rientra da solo con la condizione</text>
<text x="713.8" y="236.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">cancellato dal reset</text>
<line x1="291.0" y1="70.0" x2="291.0" y2="268.0" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="291.0" cy="292.0" r="11" fill="#898781" stroke="#898781" stroke-width="1"/><text x="291.0" y="296.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="54.0" y="330.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">1  la condizione compare</text>
<line x1="382.5" y1="70.0" x2="382.5" y2="268.0" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="382.5" cy="292.0" r="11" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="1"/><text x="382.5" y="296.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="54.0" y="350.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">2  ACKNOWLEDGE</text>
<line x1="504.5" y1="70.0" x2="504.5" y2="268.0" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="504.5" cy="292.0" r="11" fill="#d03b3b" stroke="#d03b3b" stroke-width="1"/><text x="504.5" y="296.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="54.0" y="370.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">3  PROTECTION RESET: non accettato</text>
<line x1="596.0" y1="70.0" x2="596.0" y2="268.0" stroke="#52514e" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="596.0" cy="292.0" r="11" fill="#898781" stroke="#898781" stroke-width="1"/><text x="596.0" y="296.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="54.0" y="390.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">4  la condizione rientra</text>
<line x1="705.8" y1="70.0" x2="705.8" y2="268.0" stroke="#0ca30c" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="705.8" cy="292.0" r="11" fill="#0ca30c" stroke="#0ca30c" stroke-width="1"/><text x="705.8" y="296.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="54.0" y="410.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">5  PROTECTION RESET: accettato</text>
<text x="54.0" y="328.0" font-size="1" fill="#0b0b0b" text-anchor="start" font-weight="normal"></text>
<text x="430.0" y="330.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Il riconoscimento cambia solo la presentazione.</text>
<text x="430.0" y="348.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Il reset al passo 3 non è accettato perché la causa</text>
<text x="430.0" y="366.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">è ancora presente. Dopo il passo 5 la memoria è</text>
<text x="430.0" y="384.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">vuota, ma l'impianto resta nello stato raggiunto:</text>
<text x="430.0" y="402.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">barre inserite, turbina ferma o rallentata.</text>
<text x="54.0" y="440.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">RESET e RESET ALL agiscono sulla memoria degli allarmi; PROTECTION RESET sulle protezioni: non si sostituiscono.</text>
<text x="24.0" y="474.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Tempi illustrativi; le condizioni di reset complete dipendono dalla funzione.</text>
</svg>
