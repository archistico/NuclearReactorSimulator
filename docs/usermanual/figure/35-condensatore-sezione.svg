<text x="312.0" y="66.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">scarico della turbina: ≈ 13 kg/s,</text>
<text x="312.0" y="82.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">quasi 200 m³ di vapore al secondo</text>
