<text x="30.0" y="190.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">acqua di</text>
<text x="30.0" y="206.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">raffreddamento 20 °C</text>
<path d="M440.0,209.0 L540.0,209.0" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a1baf7a)"/>
<text x="490.0" y="234.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">porta via il calore:</text>
<text x="490.0" y="250.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">≈ 27 MW, al massimo 40 MW</text>
<rect x="150.0" y="300.0" width="300.0" height="30.0" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="300.0" y="320.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">gocce di condensato</text>
<rect x="200.0" y="358.0" width="200.0" height="56.0" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/>
<path d="M300.0,332.0 L300.0,356.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a78d6)"/>
<text x="300.0" y="380.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">vasca del condensato</text>
<text x="300.0" y="397.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">10 m³ · ≈ 9,9 t · 47 °C</text>
<path d="M400.0,386.0 L540.0,386.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a78d6)"/>
<text x="488.0" y="406.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">alla pompa del condensato</text>
<rect x="655.0" y="140.0" width="220.0" height="200.0" rx="8" fill="#f6f5f2" stroke="none" stroke-width="1.5"/>
<text x="669.0" y="166.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">Spazio vapore: 1000 m³</text>
<text x="669.0" y="184.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">contiene solo ≈ 67 kg</text>
<text x="669.0" y="202.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">= circa 5 s di scarico</text>
<text x="669.0" y="220.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal"></text>
<text x="669.0" y="238.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">pressione ≈ 8,4 kPa assoluti</text>
<text x="669.0" y="256.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">condensa a ≈ 42 °C</text>
<text x="669.0" y="274.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal"></text>
<text x="669.0" y="292.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">limiti: 40 MW, 1,225 MW/K,</text>
<text x="669.0" y="310.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">20 kg/s di condensazione</text>
<text x="40.0" y="470.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Il vapore condensa sui tubi freddi e cade nella vasca. Lo spazio vapore è enorme ma quasi vuoto: contiene vapore per</text>
<text x="40.0" y="488.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">circa 5 secondi di scarico. Se la condensazione rallenta, la massa si accumula subito e la contropressione sale in fretta.</text>
<text x="24.0" y="514.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Disegno tipico di un condensatore a fascio tubiero; nel modello il fascio non è geometrico: lo rappresentano i limiti di scambio.</text>
</svg>
