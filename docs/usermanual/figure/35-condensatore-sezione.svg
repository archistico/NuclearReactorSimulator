<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Il condensatore e la vasca, in sezione</title>
<desc id="desc">Sezione schematica: il vapore di scarico entra dall'alto, condensa sul fascio di tubi dove scorre acqua di raffreddamento a 20 gradi, che porta via circa 27 MW. Le gocce cadono nella vasca del condensato da 10 metri cubi con circa 9,9 tonnellate a 47 gradi. Lo spazio vapore da 1000 metri cubi contiene solo circa 67 kg, pari a circa 5 secondi di scarico.</desc>
<rect x="0.5" y="0.5" width="899.0" height="529.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Il condensatore e la vasca, in sezione</text>
