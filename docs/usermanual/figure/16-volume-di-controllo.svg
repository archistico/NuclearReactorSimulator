<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Il conto di un volume: ciò che entra, ciò che esce, ciò che resta</title>
<desc id="desc">Un volume di controllo tratteggiato con un flusso che entra e uno che esce, calore scambiato e lavoro d'albero. Le equazioni mostrano che la massa varia con la differenza delle portate e l'energia interna con entalpie, calore e lavoro. Un riquadro spiega il lavoro di flusso con un pistone che spinge il fluido oltre la frontiera.</desc>
<rect x="0.5" y="0.5" width="899.0" height="569.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Il conto di un volume: ciò che entra, ciò che esce, ciò che resta</text>
<defs><marker id="a2a78d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="aeb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a1baf7a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a6250d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker></defs>
<rect x="330.0" y="110.0" width="240.0" height="150.0" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="2" stroke-dasharray="8 5"/>
<text x="450.0" y="170.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">volume di controllo</text>
<text x="450.0" y="190.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">massa m · energia interna U</text>
<path d="M170.0,185.0 L322.0,185.0" fill="none" stroke="#eb6834" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aeb6834)"/>
<text x="170.0" y="165.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">flusso che entra: ṁ_in · h_in</text>
<path d="M578.0,185.0 L730.0,185.0" fill="none" stroke="#eb6834" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aeb6834)"/>
<text x="590.0" y="165.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">flusso che esce: ṁ_out · h_out</text>
<path d="M450.0,50.0 L450.0,102.0" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a1baf7a)"/>
<text x="462.0" y="68.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">calore scambiato Q̇</text>
<path d="M450.0,268.0 L450.0,320.0" fill="none" stroke="#6250d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6250d6)"/>
<text x="462.0" y="304.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">lavoro d'albero Ẇ (per esempio in turbina)</text>
<rect x="80.0" y="350.0" width="740.0" height="72.0" rx="6" fill="#f6f5f2" stroke="none" stroke-width="1.5"/>
<text x="450.0" y="378.0" font-size="14.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">variazione di massa:  dm/dt = ṁ_in − ṁ_out</text>
<text x="450.0" y="404.0" font-size="14.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">variazione di energia:  dU/dt = ṁ_in · h_in − ṁ_out · h_out + Q̇ − Ẇ</text>
<text x="80.0" y="456.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Perché il flusso trasporta h e non solo u</text>
<rect x="80.0" y="470.0" width="150.0" height="44.0" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
<rect x="86.0" y="474.0" width="14.0" height="36.0" rx="2" fill="#52514e" stroke="none" stroke-width="1.5"/>
<path d="M64.0,492.0 L84.0,492.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a78d6)"/>
<line x1="230.0" y1="466.0" x2="230.0" y2="518.0" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="236.0" y="480.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">frontiera</text>
<text x="300.0" y="480.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Per far entrare il fluido, quello che sta dietro deve spingerlo contro la pressione p:</text>
<text x="300.0" y="498.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">è il lavoro di flusso, p/ρ per ogni kg. Per questo ciò che il flusso porta con sé è</text>
<text x="300.0" y="516.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">l'entalpia h = u + p/ρ, mentre il volume conserva massa ed energia interna.</text>
</svg>
