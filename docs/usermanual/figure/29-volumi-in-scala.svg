<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">I volumi del modello in scala</title>
<desc id="desc">Quadrati con area proporzionale al volume: lo spazio di scarico del condensatore da 1000 metri cubi con circa 67 kg di vapore; cinque volumi da 100 metri cubi lungo il percorso del vapore con 2-3,3 tonnellate ciascuno; sei volumi da 10 metri cubi per aspirazione, mandata, uscita dei canali, corpo cilindrico, vasca del condensato e volume di alimentazione.</desc>
<rect x="0.5" y="0.5" width="899.0" height="539.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">I volumi del modello in scala</text>
<rect x="40.0" y="96.0" width="284.6" height="284.6" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<text x="40.0" y="396.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Spazio di scarico del condensatore</text>
<text x="40.0" y="411.6" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">1000 m³ · circa 67 kg di vapore a 8,4 kPa</text>
<text x="40.0" y="427.6" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">un cubo di 10 m di lato</text>
<text x="182.3" y="232.3" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600">1 000 000 litri</text>
<text x="182.3" y="252.3" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">quasi vuoti: 67 g di vapore per m³</text>
<text x="370.0" y="76.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Percorso del vapore: cinque volumi da 100 m³ (un cubo di 4,6 m)</text>
<rect x="370.0" y="96.0" width="90.0" height="90.0" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<text x="370.0" y="202.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">partenza linea</text>
<text x="370.0" y="217.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">3,3 t di vapore</text>
<rect x="470.0" y="96.0" width="90.0" height="90.0" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<text x="470.0" y="202.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">collettore</text>
<text x="470.0" y="217.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">3,2 t di vapore</text>
<rect x="570.0" y="96.0" width="90.0" height="90.0" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<text x="570.0" y="202.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">dopo STOP</text>
<text x="570.0" y="217.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">3,1 t di vapore</text>
<rect x="670.0" y="96.0" width="90.0" height="90.0" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<text x="670.0" y="202.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">dopo CONTROL</text>
<text x="670.0" y="217.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">2,1 t di vapore</text>
<rect x="770.0" y="96.0" width="90.0" height="90.0" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<text x="770.0" y="202.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">ingresso turbina</text>
<text x="770.0" y="217.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">2,0 t di vapore</text>
<text x="370.0" y="280.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">Circuito dell'acqua: sei volumi da 10 m³ (10 000 litri ciascuno)</text>
<rect x="370.0" y="300.0" width="28.5" height="28.5" rx="3" fill="#cde2fb" stroke="#52514e" stroke-width="1.2"/>
<text x="370.0" y="344.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">aspirazione</text>
<text x="370.0" y="359.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">7,5 t</text>
<text x="370.0" y="375.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">liquido 280 °C</text>
<rect x="453.0" y="300.0" width="28.5" height="28.5" rx="3" fill="#cde2fb" stroke="#52514e" stroke-width="1.2"/>
<text x="453.0" y="344.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">mandata</text>
<text x="453.0" y="359.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">7,5 t</text>
<text x="453.0" y="375.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">liquido 280 °C</text>
<rect x="536.0" y="300.0" width="28.5" height="28.5" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<rect x="536.6" y="324.3" width="27.3" height="3.5" rx="2" fill="#cde2fb" stroke="none" stroke-width="1.5"/>
<text x="536.0" y="344.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">uscita canali</text>
<text x="536.0" y="359.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">1,4 t</text>
<text x="536.0" y="375.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">miscela</text>
<rect x="619.0" y="300.0" width="28.5" height="28.5" rx="3" fill="#fbe0d3" stroke="#52514e" stroke-width="1.2"/>
<rect x="619.6" y="314.2" width="27.3" height="13.6" rx="2" fill="#cde2fb" stroke="none" stroke-width="1.5"/>
<text x="619.0" y="344.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">corpo cil.</text>
<text x="619.0" y="359.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">3,9 t</text>
<text x="619.0" y="375.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">metà e metà</text>
<rect x="702.0" y="300.0" width="28.5" height="28.5" rx="3" fill="#cde2fb" stroke="#52514e" stroke-width="1.2"/>
<text x="702.0" y="344.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">vasca</text>
<text x="702.0" y="359.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">9,9 t</text>
<text x="702.0" y="375.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">liquido 47 °C</text>
<rect x="785.0" y="300.0" width="28.5" height="28.5" rx="3" fill="#cde2fb" stroke="#52514e" stroke-width="1.2"/>
<text x="785.0" y="344.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">alimentaz.</text>
<text x="785.0" y="359.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">9,9 t</text>
<text x="785.0" y="375.5" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">liquido 47 °C</text>
<rect x="370.0" y="420.0" width="14.0" height="14.0" rx="2" fill="#cde2fb" stroke="#52514e" stroke-width="1"/>
<text x="390.0" y="432.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">liquido</text>
<rect x="460.0" y="420.0" width="14.0" height="14.0" rx="2" fill="#fbe0d3" stroke="#52514e" stroke-width="1"/>
<text x="480.0" y="432.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">vapore</text>
<text x="550.0" y="432.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">il lato di ogni quadrato è proporzionale alla radice del volume</text>
<text x="40.0" y="482.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Stesso volume, masse molto diverse: 10 m³ di liquido caldo pesano 7,5 t, 10 m³ di vapore a 6,4 MPa circa 330 kg,</text>
<text x="40.0" y="500.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">10 m³ di vapore nello scarico meno di 1 kg. Per questo il volume da solo non dice quanta acqua c'è: serve anche lo stato.</text>
<text x="24.0" y="524.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Masse al punto iniziale Exact-V9, calcolate da pressione, titolo e volume; arrotondate.</text>
</svg>
