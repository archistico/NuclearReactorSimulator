<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Con quali mattoni è costruito l'impianto simulato</title>
<desc id="desc">Cinque schede: volume che contiene massa ed energia; tubo con caduta di pressione proporzionale al quadrato della portata; valvola come resistenza variabile con corsa finita; pompa con spinta proporzionale al quadrato della velocità; corpo termico con capacità e conduttanza. Ogni scheda riporta un esempio numerico del punto iniziale.</desc>
<rect x="0.5" y="0.5" width="899.0" height="469.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Con quali mattoni è costruito l'impianto simulato</text>
<defs><marker id="a2a78d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="aeb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a1baf7a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="30.0" y="70.0" width="156.0" height="300.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="42.0" y="94.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Volume</text>
<text x="42.0" y="112.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">nodo</text>
<rect x="68.0" y="140.0" width="80.0" height="60.0" rx="4" fill="#fbe0d3" stroke="#52514e" stroke-width="1.5"/>
<rect x="68.6" y="170.0" width="78.8" height="29.4" rx="3" fill="#cde2fb" stroke="none" stroke-width="1.5"/>
<text x="108.0" y="160.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">m, U, V</text>
<text x="42.0" y="240.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">contiene massa ed energia;</text>
<text x="42.0" y="257.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">pressione e temperatura</text>
<text x="42.0" y="274.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">ne derivano</text>
<line x1="42.0" y1="302.0" x2="174.0" y2="302.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="42.0" y="324.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">corpo cilindrico: 10 m³</text>
<rect x="198.0" y="70.0" width="156.0" height="300.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="210.0" y="94.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Tubo</text>
<text x="210.0" y="112.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">resistenza fissa</text>
<path d="M221.0,170.0 L326.0,170.0" fill="none" stroke="#2a78d6" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M221.0,170.0 L328.0,170.0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a52514e)"/>
<text x="210.0" y="240.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">Δp = R · ṁ²</text>
<text x="210.0" y="257.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">più portata, molta più</text>
<text x="210.0" y="274.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">caduta di pressione</text>
<line x1="210.0" y1="302.0" x2="342.0" y2="302.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="210.0" y="324.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">linea vapore: R = 850</text>
<text x="210.0" y="340.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">→ 0,15 MPa a 13,3 kg/s</text>
<rect x="366.0" y="70.0" width="156.0" height="300.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="378.0" y="94.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Valvola</text>
<text x="378.0" y="112.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">resistenza variabile</text>
<path d="M384.0,170.0 L428.0,170.0" fill="none" stroke="#eb6834" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M460.0,170.0 L504.0,170.0" fill="none" stroke="#eb6834" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M431.0,160.25 L457.0,179.75 L457.0,160.25 L431.0,179.75 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><line x1="444.0" y1="160.2" x2="444.0" y2="149.2" stroke="#52514e" stroke-width="1.6"/><line x1="438.0" y1="149.2" x2="450.0" y2="149.2" stroke="#52514e" stroke-width="1.6"/><text x="444.0" y="199.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600"></text>
<text x="378.0" y="240.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">caratteristica lineare,</text>
<text x="378.0" y="257.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">corsa finita; senza</text>
<text x="378.0" y="274.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">comando va in chiusura</text>
<line x1="378.0" y1="302.0" x2="510.0" y2="302.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="378.0" y="324.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">CONTROL al 29%:</text>
<text x="378.0" y="340.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">→ 2,1 MPa di caduta</text>
<rect x="534.0" y="70.0" width="156.0" height="300.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="546.0" y="94.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Pompa</text>
<text x="546.0" y="112.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">spinta − resistenza</text>
<path d="M552.0,170.0 L594.0,170.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M630.0,170.0 L672.0,170.0" fill="none" stroke="#2a78d6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a78d6)"/>
<circle cx="612.0" cy="170.0" r="17" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/><path d="M605.0,161.0 L622.0,170.0 L605.0,179.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="612.0" y="204.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal"></text>
<text x="546.0" y="240.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">spinta ∝ velocità²;</text>
<text x="546.0" y="257.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">ritegno allo scarico</text>
<text x="546.0" y="274.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">nel ciclo secondario</text>
<line x1="546.0" y1="302.0" x2="678.0" y2="302.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="546.0" y="324.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">alimentazione: 7 MPa</text>
<text x="546.0" y="340.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">× 0,97² ≈ 6,6 MPa</text>
<rect x="702.0" y="70.0" width="156.0" height="300.0" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
<text x="714.0" y="94.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Corpo termico</text>
<text x="714.0" y="112.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal">capacità + scambio</text>
<rect x="750.0" y="142.0" width="44.0" height="56.0" rx="4" fill="#f6d5c6" stroke="#eb6834" stroke-width="1.5"/>
<text x="772.0" y="175.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">C</text>
<path d="M796.0,170.0 L832.0,170.0" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a1baf7a)"/>
<text x="814.0" y="162.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">G</text>
<text x="714.0" y="240.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">C accumula calore,</text>
<text x="714.0" y="257.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">G lo cede al fluido;</text>
<text x="714.0" y="274.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">tempo tipico τ = C/G</text>
<line x1="714.0" y1="302.0" x2="846.0" y2="302.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="714.0" y="324.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">combustibile: 10 MJ/K,</text>
<text x="714.0" y="340.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">1 MW/K → τ ≈ 10 s</text>
<text x="30.0" y="410.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Il modello non conosce diametri, lunghezze o quote: ogni componente è uno di questi cinque mattoni, con pochi numeri.</text>
<text x="30.0" y="428.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Per immaginarlo useremo forme equivalenti, per esempio un cilindro con lo stesso volume, dichiarandole come tali.</text>
</svg>
