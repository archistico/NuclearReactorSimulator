<line x1="285.0" y1="250.0" x2="285.0" y2="500.0" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 4"/>
<text x="202.5" y="236.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">uguali: fermo</text>
<line x1="450.0" y1="250.0" x2="450.0" y2="500.0" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 4"/>
<text x="367.5" y="236.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">entra di più: cresce</text>
<line x1="615.0" y1="250.0" x2="615.0" y2="500.0" stroke="#e1e0d9" stroke-width="1" stroke-dasharray="3 4"/>
<text x="532.5" y="236.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">uguali: fermo, ma più alto</text>

<text x="697.5" y="236.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">esce di più: scende</text>
<text x="40.0" y="566.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Il ritmo con cui cambia ciò che è accumulato è la differenza fra ingresso e uscita, non il valore delle due portate.</text>
<text x="40.0" y="584.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Un livello fermo dice che ingresso e uscita sono uguali in quel momento; non dice che resteranno uguali.</text>
<text x="24.0" y="604.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Andamento qualitativo, senza unità: illustra il principio.</text>
