<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Ogni accumulo segue la stessa regola: entra − esce</title>
<desc id="desc">Tre esempi di accumulo: il corpo cilindrico accumula massa d'acqua, il combustibile energia termica, il rotore energia cinetica. Sotto, un grafico qualitativo: finché ingresso e uscita sono uguali l'accumulo resta fermo; quando entra di più cresce, quando esce di più scende.</desc>
<rect x="0.5" y="0.5" width="899.0" height="619.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Ogni accumulo segue la stessa regola: entra − esce</text>
