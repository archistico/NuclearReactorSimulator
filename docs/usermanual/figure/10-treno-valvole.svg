<path d="M317,90.25 L343,109.75 L343,90.25 L317,109.75 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><line x1="330.0" y1="90.2" x2="330.0" y2="79.2" stroke="#52514e" stroke-width="1.6"/><line x1="324.0" y1="79.2" x2="336.0" y2="79.2" stroke="#52514e" stroke-width="1.6"/><text x="330.0" y="129.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">CONTROL</text>
<path d="M477,90.25 L503,109.75 L503,90.25 L477,109.75 Z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round"/><line x1="490.0" y1="90.2" x2="490.0" y2="79.2" stroke="#52514e" stroke-width="1.6"/><line x1="484.0" y1="79.2" x2="496.0" y2="79.2" stroke="#52514e" stroke-width="1.6"/><text x="490.0" y="129.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">ADMISSION</text>
<path d="M640,88 L700,68 L700,132 L640,112 Z" fill="#fbe0d3" stroke="#eb6834" stroke-width="2"/>
<text x="670.0" y="150.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">stadio</text>
<circle cx="90.0" cy="100.0" r="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="90.0" y="78.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">collettore</text>
<circle cx="250.0" cy="100.0" r="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="250.0" y="78.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">dopo STOP</text>
<circle cx="410.0" cy="100.0" r="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="410.0" y="78.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">dopo CONTROL</text>
<circle cx="570.0" cy="100.0" r="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="570.0" y="78.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">ingresso turbina</text>
<circle cx="760.0" cy="100.0" r="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="760.0" y="78.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">scarico</text>
<text x="60.0" y="174.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">pressione nei nodi lungo il percorso (qualitativa)</text>
<line x1="60.0" y1="330.0" x2="800.0" y2="330.0" stroke="#c3c2b7" stroke-width="1.5"/>
