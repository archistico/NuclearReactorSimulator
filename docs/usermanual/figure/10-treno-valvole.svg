<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Il treno di ammissione: la restrizione più stretta comanda</title>
<desc id="desc">In alto il percorso dal collettore alle valvole STOP, CONTROL e ADMISSION, allo stadio e allo scarico, con la pressione che scende a ogni passaggio. Al centro le capacità dei quattro passaggi: la più piccola, qui CONTROL, fissa la portata dello stadio. In basso una richiesta al 100% raggiunta dalla posizione effettiva in circa 1,4 s.</desc>
<rect x="0.5" y="0.5" width="899.0" height="769.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Il treno di ammissione: la restrizione più stretta comanda</text>
<defs><marker id="aeb6834" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<path d="M60.0,100.0 L800.0,100.0" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
