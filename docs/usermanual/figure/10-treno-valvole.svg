<rect x="220.0" y="202.7" width="60.0" height="127.3" rx="3" fill="#fbe0d3" stroke="#eb6834" stroke-width="1.2"/>
<rect x="380.0" y="241.6" width="60.0" height="88.4" rx="3" fill="#fbe0d3" stroke="#eb6834" stroke-width="1.2"/>
<rect x="540.0" y="246.9" width="60.0" height="83.1" rx="3" fill="#fbe0d3" stroke="#eb6834" stroke-width="1.2"/>
<rect x="730.0" y="326.0" width="60.0" height="4.0" rx="3" fill="#fbe0d3" stroke="#eb6834" stroke-width="1.2"/>
<text x="170.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">ΔP stop</text>
<text x="330.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">ΔP control</text>
<text x="490.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">ΔP admission</text>
<text x="665.0" y="320.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">ΔP espansione</text>
<text x="60.0" y="368.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">capacità di ciascun passaggio nello stesso passo, con la posizione effettiva delle valvole</text>
<text x="150.0" y="395.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">STOP</text>
<rect x="162.0" y="382.0" width="483.6" height="18.0" rx="4" fill="#e1e0d9" stroke="none" stroke-width="1.5"/>
<text x="150.0" y="425.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">CONTROL</text>
<rect x="162.0" y="412.0" width="416.0" height="18.0" rx="4" fill="#6250d6" stroke="none" stroke-width="1.5"/>
<text x="588.0" y="426.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">la più piccola fissa la portata dello stadio</text>
<text x="150.0" y="455.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">ADMISSION</text>
<rect x="162.0" y="442.0" width="504.4" height="18.0" rx="4" fill="#e1e0d9" stroke="none" stroke-width="1.5"/>
<text x="150.0" y="485.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">espansione</text>
<rect x="162.0" y="472.0" width="468.0" height="18.0" rx="4" fill="#e1e0d9" stroke="none" stroke-width="1.5"/>
<line x1="578.0" y1="378.0" x2="578.0" y2="500.0" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60.0" y="540.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">richiesta e posizione: la corsa richiede tempo (circa 50 punti % al secondo)</text>
<line x1="120.0" y1="680.0" x2="480.0" y2="680.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="112.0" y="684.0" font-size="11.5" fill="#898781" text-anchor="end" font-weight="normal">0</text>
<line x1="120.0" y1="620.0" x2="480.0" y2="620.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="112.0" y="624.0" font-size="11.5" fill="#898781" text-anchor="end" font-weight="normal">50</text>
<line x1="120.0" y1="560.0" x2="480.0" y2="560.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="112.0" y="564.0" font-size="11.5" fill="#898781" text-anchor="end" font-weight="normal">100</text>
<text x="120.0" y="698.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">0</text>
<text x="210.0" y="698.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">0,5</text>
<text x="300.0" y="698.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">1</text>
<text x="390.0" y="698.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">1,5</text>
<text x="480.0" y="698.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">2</text>
<line x1="120.0" y1="680.0" x2="480.0" y2="680.0" stroke="#c3c2b7" stroke-width="1.5"/>
<line x1="120.0" y1="560.0" x2="120.0" y2="680.0" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="300.0" y="718.0" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">secondi dalla richiesta</text>
<text transform="translate(74.0,620.0) rotate(-90)" font-size="12.5" fill="#52514e" text-anchor="middle">apertura %</text>
<path d="M120.0,644.0 L120.0,560.0 L480.0,560.0" fill="none" stroke="#52514e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M120.0,644.0 L372.0,560.0 L480.0,560.0" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="399.0" y="578.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">TARGET 100%</text>
<text x="270.0" y="616.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">posizione effettiva</text>
<text x="520.0" y="600.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Da 30% a 100% servono circa 1,4 s.</text>
<text x="520.0" y="620.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Prima di quel momento la capacità</text>
<text x="520.0" y="638.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">dipende dalla posizione raggiunta,</text>
<text x="520.0" y="656.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">non dal valore richiesto.</text>
<text x="24.0" y="754.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Altezze e capacità qualitative. Anche metà inventario per passo all'ingresso turbina è un limite, lontano nel punto iniziale.</text>
</svg>
