<text x="428.5" y="372.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="normal">solo perdite 0,5 MW: ≈ −15 giri/min al secondo</text>
<rect x="680.0" y="80.0" width="200.0" height="220.0" rx="8" fill="#f6f5f2" stroke="none" stroke-width="1.5"/>
<text x="694.0" y="106.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">Rotore del modello</text>
<text x="694.0" y="124.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal"></text>
<text x="694.0" y="142.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">inerzia 1000 kg·m²</text>
<text x="694.0" y="160.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">energia a 3000 giri/min:</text>
<text x="694.0" y="178.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">≈ 49 MJ</text>
<text x="694.0" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal"></text>
<text x="694.0" y="214.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">49 MJ bastano per circa 10 s</text>
<text x="694.0" y="232.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">di 5 MW</text>
<text x="694.0" y="250.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal"></text>
<text x="694.0" y="268.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">CONTROL dal 29% a 0%:</text>
<text x="694.0" y="286.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">≈ 0,6 s a 50 punti %/s</text>
<text x="40.0" y="444.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Se il carico elettrico sparisce mentre il vapore continua, 5 MW di troppo portano il rotore da 3000 a 3300 giri/min in</text>
<text x="40.0" y="462.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">circa 2 secondi: il regolatore deve chiudere CONTROL subito, e la sua corsa richiede circa 0,6 s. Al contrario, togliere</text>
<text x="40.0" y="480.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">il vapore lascia rallentare il rotore lentamente, perché lo frenano soltanto le perdite.</text>
<text x="24.0" y="504.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Calcolo senza regolatore, dalla sola inerzia del modello: mostra i ritmi in gioco, non una prova registrata.</text>
</svg>
