<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Quanto in fretta cambia la velocità del rotore</title>
<desc id="desc">Grafico della velocità nei primi 4 secondi: con 5 MW di potenza in eccesso il rotore sale di circa 150 giri/min al secondo e raggiunge la soglia di scatto di 3300 in circa 2 secondi; con le sole perdite di 0,5 MW rallenta di circa 15 giri/min al secondo. Un riquadro riporta inerzia di 1000 kg·m², energia cinetica di circa 49 MJ e tempo di chiusura della valvola CONTROL.</desc>
