<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">La pressione lungo il giro completo dell'acqua</title>
<desc id="desc">Pressione assoluta in scala logaritmica nei nodi del ciclo, dal collettore di aspirazione al ritorno nel corpo cilindrico: circa 6,4-6,9 MPa nel circuito caldo, caduta di 2,1 MPa nella valvola CONTROL, espansione in turbina fino a 8,4 kPa, poi risalita con la pompa del condensato e con la pompa di alimentazione fino a 6,4 MPa.</desc>
<rect x="0.5" y="0.5" width="899.0" height="559.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">La pressione lungo il giro completo dell'acqua</text>
<defs><marker id="a6250d6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<line x1="120.0" y1="374.5" x2="820.0" y2="374.5" stroke="#e1e0d9" stroke-width="1"/>
