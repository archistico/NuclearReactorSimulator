<text x="417.5" y="398.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">portata A</text>
<text x="314.0" y="398.0" font-size="11.5" fill="#898781" text-anchor="middle" font-weight="normal">portata B</text>
<text x="118.0" y="150.6" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">spinta a portata nulla</text>
<text x="110.0" y="450.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">La portata nasce dall'incrocio fra ciò che la pompa fornisce e ciò che il circuito richiede.</text>
<text x="110.0" y="468.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Se la contropressione supera la spinta a portata nulla non c'è incrocio: con il ritegno la portata è zero,</text>
<text x="110.0" y="486.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">anche con la pompa in marcia.</text>
<text x="24.0" y="514.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="normal" font-style="italic">Curve qualitative senza scala numerica: illustrano il principio, non le caratteristiche delle pompe del modello.</text>
