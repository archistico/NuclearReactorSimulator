<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Perché una pompa in marcia non garantisce la portata</title>
<desc id="desc">Grafico qualitativo spinta-portata: la caratteristica decrescente della pompa incrocia la curva del circuito aperto nel punto di lavoro A e quella di un circuito più resistente nel punto B, a portata minore. Una curva con contropressione superiore alla spinta a portata nulla non la incrocia.</desc>
<rect x="0.5" y="0.5" width="899.0" height="529.0" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Perché una pompa in marcia non garantisce la portata</text>
<defs><marker id="a52514e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
