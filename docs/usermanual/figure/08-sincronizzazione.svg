<text x="330.0" y="336.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Fase: scarto ≤ 10°</text>
<text x="550.0" y="336.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Tensione: scarto ≤ 10 kV</text>
<text x="90.0" y="370.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Con 0,2 Hz di scarto la fase scorre di 72° al secondo: un giro completo ogni 5 s.</text>
<text x="90.0" y="388.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">La finestra di ±10° resta aperta per circa 0,28 s a ogni giro: frequenza giusta non basta, serve anche il momento giusto.</text>
