<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title id="title">Sincronizzazione: frequenza, fase e tensione insieme</title>
<desc id="desc">Due onde sinusoidali nei primi 40 ms: rete a 50 Hz e generatore a 50,2 Hz con 30 gradi di sfasamento. Un sincronoscopio mostra la finestra di più o meno 10 gradi e la lancetta fuori finestra. Seguono i tre consensi e il calcolo del tempo di permanenza nella finestra.</desc>
